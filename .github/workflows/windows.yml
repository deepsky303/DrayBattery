name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build executable
        shell: cmd
        run: call build-msvc.cmd
      - name: Run tests
        shell: cmd
        run: call run-tests-msvc.cmd
      - name: Archive portable executable
        uses: actions/upload-artifact@v4
        with:
          name: DrayBattery-Windows-x64
          path: dist/DrayBattery.exe
